<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Jarvis Portal{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <span class="font-bold text-gray-900 text-lg">Jarvis</span>
    <span class="text-gray-400 text-sm">Developer Portal</span>
  </div>
  {% if user %}
  <div class="flex items-center gap-4 text-sm">
    {% if user.is_admin %}
    <a href="/admin" class="text-gray-600 hover:text-gray-900">Admin</a>
    {% endif %}
    <a href="/dashboard" class="text-gray-600 hover:text-gray-900">Dashboard</a>
    <span class="text-gray-400">{{ user.email }}</span>
    <a href="/logout" class="text-red-600 hover:text-red-800">Sign out</a>
  </div>
  {% endif %}
</nav>

<main class="max-w-4xl mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>

</body>
</html>
